upstream docker-web {
     server backend:8080;
 }

# Brute-force protection for password endpoints: 10 attempts per minute per client IP
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

 server {
   include /etc/nginx/extra-conf.d/*.conf;

   listen 80;
   server_name frontend;

   # Use the client IP sent by a reverse proxy in front of this container (only trusted from private networks)
   set_real_ip_from 10.0.0.0/8;
   set_real_ip_from 172.16.0.0/12;
   set_real_ip_from 192.168.0.0/16;
   set_real_ip_from 127.0.0.1;
   real_ip_header X-Forwarded-For;

   location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri $uri/ /index.html =404;
   }

   location ~ ^/api/auth/(login|changePassword)$ {
      limit_req zone=auth burst=5 nodelay;
      error_page 429 = @too_many_requests;

      proxy_pass http://kurswahl_backendcontainer:8080;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
   }

   location @too_many_requests {
      default_type text/plain;
      return 429 "Zu viele Anmeldeversuche. Bitte warte eine Minute und versuche es erneut.";
   }

   location /api/ {
      proxy_pass http://kurswahl_backendcontainer:8080;
      # In our case Container name is as we setup in docker-compose `demo` and port 8080
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
  }
}
